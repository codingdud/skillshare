# Publishes @skillsync/cli to npm.
# - push to main (CLI or contracts changes): publishes, and fails if the apps/cli/package.json version is already on npm
# - release published: the tag must match the CLI version (for example v0.1.4 or cli-v0.1.4)
# - manual run from the Actions tab

name: Publish CLI

on:
  push:
    branches: [main]
    paths:
      - apps/cli/**
      - packages/contracts/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag matches the CLI version
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          tag="${GITHUB_REF_NAME#cli-}"
          tag="${tag#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match apps/cli version '$version'." >&2
            exit 1
          fi
      - name: Typecheck, test, build and smoke-test the CLI
        run: npm run cli:check

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Fail if the version was not bumped
        run: |
          name=$(node -p "require('./apps/cli/package.json').name")
          version=$(node -p "require('./apps/cli/package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on npm. Bump the version in apps/cli/package.json before publishing."
            exit 1
          fi
      - name: Publish to npm
        run: npm publish -w @skillsync/cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
