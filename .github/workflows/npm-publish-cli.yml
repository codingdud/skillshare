# Publishes @skillsync/cli to npm when a GitHub release is published.
# The release tag must match apps/cli/package.json (for example v0.1.3 or cli-v0.1.3).

name: Publish CLI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag matches the CLI version
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          tag="${GITHUB_REF_NAME#cli-}"
          tag="${tag#v}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match apps/cli version '$version'." >&2
            exit 1
          fi
      - name: Typecheck, test, build and smoke-test the CLI
        run: npm run cli:check

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish -w @skillsync/cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
